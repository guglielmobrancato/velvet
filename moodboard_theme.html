<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Punk Moodboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/moodboard_theme.css">
</head>
<body>
    <div class="noise-overlay"></div>
    <div class="grid-background"></div>

    <header class="hero-section">
        <h1 class="glitch" data-text="COSMIC ORANGE">COSMIC ORANGE</h1>
        <p class="subtitle">ASTRO PUNK MOODBOARD EXPLORATION</p>
        <div class="glow-line"></div>
    </header>

    <main class="moodboard-container">
        <!-- Images will be dynamically loaded here by JS -->
        <div class="masonry-grid" id="moodboard-grid"></div>
    </main>

    <footer>
        <p>SYSTEM BOOT // DIRECTIVE: EXPLORE // STATUS: NOMINAL</p>
    </footer>

    <script src="assets/js/moodboard_theme.js"></script>
</body>
</html>
